name: Daily AX News Digest

on:
  # 자동 트리거는 cron-job.org → GitHub API workflow_dispatch 로 일원화.
  # (GitHub 자체 schedule 은 지연·누락이 잦아서 제거했고, 주말·공휴일 거르기는 main.py 가 담당.)
  workflow_dispatch: {}

permissions:
  contents: write   # data/, state/ 커밋용
  pages: write      # GitHub Pages 배포용
  id-token: write   # Pages 배포 인증용

concurrency:
  group: ax-newsbot-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 1단계: 수집 → 요약 → 사이트 빌드 (텔레그램 발송은 아직)
      - name: Prepare digest (no telegram)
        id: prepare
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.main --prepare-only

      - name: Commit data & state
        if: always()
        run: |
          git config user.name "ax-newsbot"
          git config user.email "ax-newsbot@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
          else
            git commit -m "chore: 다이제스트 데이터 $(date -u +%F) [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Ensure site directory exists
        if: always()
        run: mkdir -p site

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # ── 2단계: Pages 배포 (사이트가 라이브에 올라갈 때까지 대기)
      - name: Deploy to GitHub Pages
        id: deploy
        if: always()
        uses: actions/deploy-pages@v4

      # ── 3단계: 사이트가 라이브에 올라간 다음에야 텔레그램 발송
      - name: Send Telegram (after Pages is live)
        id: send
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main --send-only

      - name: Commit sent marker
        if: always()
        run: |
          git pull --rebase --autostash || true
          git add state
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
          else
            git commit -m "chore: 발송 마커 $(date -u +%F) [skip ci]"
            git push
          fi

      - name: Fail run if prepare or send errored
        if: always() && (steps.prepare.outcome == 'failure' || steps.send.outcome == 'failure')
        run: |
          echo "::error::prepare 또는 send 단계 실패 — 로그/Job Summary 를 확인하세요."
          exit 1
