# ============================================================================
# AX 뉴스봇 설정 — 이 파일만 고치면 소스/키워드/주제를 자유롭게 바꿀 수 있다.
# ============================================================================

settings:
  timezone: "Asia/Seoul"
  # 기사 수집 시 "최근 N시간" 이내 발행분만 후보로 본다(여유 있게 30시간).
  time_window_hours: 30
  # 다이제스트에 담을 하루 최대 기사 수 / 주제별 상한
  max_articles_total: 20
  max_articles_per_topic: 6
  # 기사가 다이제스트에 포함되려면 넘어야 하는 최소 점수
  min_score: 1.0

  # --- 발송 후 채워야 하는 값들 (README 셋업 참고) ---
  # GitHub Pages 주소. 형식: https://<github-사용자명>.github.io/<저장소명>
  archive_base_url: "https://jym0514.github.io/ax-newsbot"
  # 팀원 개선의견 수집용 Google Form '보내기 > 링크' 주소
  feedback_form_url: "https://docs.google.com/forms/d/e/1FAIpQLSfUTmaqdL-NSyDKpBXXS6zjdqUHKodW5WElhMlNHgeZ5By-_Q/viewform"

  # Anthropic 요약 모델 / 출력 언어
  summary_model: "claude-haiku-4-5"
  summary_language: "ko"

# ============================================================================
# 주제(topic) — 기사는 키워드 점수가 가장 높은 주제로 분류된다.
# 어느 주제에도 키워드가 걸리지 않는 기사는 제외된다(키워드 = 필터 역할).
# priority 값이 작을수록 동점 시 우선. (catch-all 인 ai_ax_trends 를 마지막에 둠)
# ============================================================================
