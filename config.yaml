# ============================================================================
# 소스 — RSS, Bluesky, X.
# weight: 랭킹 점수에 곱해지는 소스 신뢰/관련도 가중치(0.5~1.5 권장).
# ============================================================================
sources:
  # --- RSS / Substack (퍼블리케이션별 RSS) ---------------------------------
  rss:
    # 해외 Substack 뉴스레터
    - { name: "One Useful Thing (Ethan Mollick)", url: "https://www.oneusefulthing.org/feed", weight: 1.3, kind: substack }
    - { name: "Latent Space (swyx)",              url: "https://www.latent.space/feed",       weight: 1.3, kind: substack }
    - { name: "Interconnects (Nathan Lambert)",   url: "https://www.interconnects.ai/feed",   weight: 1.2, kind: substack }
    - { name: "Import AI (Jack Clark)",           url: "https://importai.substack.com/feed",  weight: 1.2, kind: substack }
    - { name: "Ahead of AI (S. Raschka)",         url: "https://magazine.sebastianraschka.com/feed", weight: 1.2, kind: substack }
    - { name: "AI Supremacy",                     url: "https://www.ai-supremacy.com/feed",   weight: 1.0, kind: substack }
    - { name: "The Algorithmic Bridge",           url: "https://www.thealgorithmicbridge.com/feed", weight: 1.0, kind: substack }
    - { name: "Exponential View (Azeem Azhar)",   url: "https://www.exponentialview.co/feed", weight: 1.1, kind: substack }
    - { name: "Towards AI",                       url: "https://newsletter.towardsai.net/feed", weight: 1.0, kind: substack }
    - { name: "Last Week in AI",                  url: "https://lastweekin.ai/feed",          weight: 1.0, kind: substack }

    # 해외 테크/AI 매체
    - { name: "The Decoder",        url: "https://the-decoder.com/feed/", weight: 1.1, kind: rss }
    - { name: "TechCrunch AI",      url: "https://techcrunch.com/category/artificial-intelligence/feed/", weight: 1.1, kind: rss }
    - { name: "The Verge",          url: "https://www.theverge.com/rss/index.xml", weight: 1.0, kind: rss }
    - { name: "VentureBeat AI",     url: "https://venturebeat.com/category/ai/feed/", weight: 1.0, kind: rss }
    - { name: "MIT Tech Review",    url: "https://www.technologyreview.com/feed/", weight: 1.1, kind: rss }
    - { name: "Ars Technica",       url: "https://feeds.arstechnica.com/arstechnica/index", weight: 0.9, kind: rss }
    - { name: "Hacker News (front)",url: "https://hnrss.org/frontpage", weight: 0.8, kind: rss }

    # 기업 공식 블로그
    - { name: "OpenAI News",        url: "https://openai.com/news/rss.xml", weight: 1.3, kind: rss }
    - { name: "Google DeepMind",    url: "https://deepmind.google/blog/rss.xml", weight: 1.2, kind: rss }
    - { name: "Hugging Face Blog",  url: "https://huggingface.co/blog/feed.xml", weight: 1.0, kind: rss }

    # 국내 AI/테크 매체
    - { name: "AI타임스",            url: "https://www.aitimes.com/rss/allArticle.xml", weight: 1.3, kind: rss }
    - { name: "인공지능신문",         url: "https://www.aitimes.kr/rss/allArticle.xml", weight: 1.2, kind: rss }
    - { name: "THE AI",             url: "https://www.newstheai.com/rss/allArticle.xml", weight: 1.1, kind: rss }
    - { name: "스마트타임스",         url: "https://www.smarttimes.co.kr/rss/allArticle.xml", weight: 0.9, kind: rss }
    - { name: "바이라인네트워크",      url: "https://byline.network/feed/", weight: 1.1, kind: rss }
    - { name: "GeekNews",           url: "https://news.hada.io/rss/news", weight: 1.0, kind: rss }
    - { name: "ZDNet Korea",        url: "https://feeds.feedburner.com/zdkorea", weight: 0.9, kind: rss }
    - { name: "전자신문 ICT",        url: "https://rss.etnews.com/Section901.xml", weight: 1.0, kind: rss }

    # 국내 기업 기술블로그 (AX 사례용, 가중치 낮음)
    - { name: "카카오 Tech",         url: "https://tech.kakao.com/feed/", weight: 0.8, kind: rss }
    - { name: "토스 기술블로그",       url: "https://toss.tech/rss.xml", weight: 0.8, kind: rss }

  # --- Bluesky (X 보조; AT Protocol 공개 API, 인증 불필요) -------------------
  # handle 은 bsky.app 프로필의 핸들(@ 제외). 잘못된 핸들은 그냥 건너뛴다.
  # README 안내대로 실제 팔로우하는 AI 인사 핸들로 교체하면 좋다.
  bluesky:
    enabled: true
    posts_per_account: 25
    accounts:
      - "bsky.app"          # 예시 — 실제 핸들로 교체 권장

  # --- X / Twitter (Mac 로컬 수집기가 사용) ---------------------------------
  x:
    home_feed: true         # x.com/home 타임라인 스크롤 수집
    scroll_rounds: 18       # 스크롤 횟수(많을수록 더 많은 트윗, 더 느림)
    min_engagement: 5       # 좋아요+리포스트 합이 이 값 미만이면 버림
    # 홈 피드 외에 특정 계정도 추가로 보고 싶으면 핸들을 넣는다(@ 제외)
    accounts: []
